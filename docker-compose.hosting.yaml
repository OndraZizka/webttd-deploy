# Generated from docker/src/main/compose/docker-compose.hosting.yaml by Maven.
# Coolify: route the app domain to service "app" on port 8080.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: webttd
      POSTGRES_USER: webttd
      POSTGRES_PASSWORD: ${WEBTTD_DB_PASSWORD:?}
    volumes:
      - webttd-pg-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webttd -d webttd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ondrejzizka/webttd:latest
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBTTD_DB_URL: jdbc:postgresql://db:5432/webttd
      WEBTTD_DB_USER: webttd
      WEBTTD_DB_PASSWORD: ${WEBTTD_DB_PASSWORD:?}
      WEBTTD_VEHICLE_STATION_DWELL_ROAD_SECONDS: ${WEBTTD_VEHICLE_STATION_DWELL_ROAD_SECONDS:-4}
      WEBTTD_VEHICLE_STATION_DWELL_RAIL_SECONDS: ${WEBTTD_VEHICLE_STATION_DWELL_RAIL_SECONDS:-15}
      WEBTTD_VEHICLE_STATION_DWELL_AIRCRAFT_SECONDS: ${WEBTTD_VEHICLE_STATION_DWELL_AIRCRAFT_SECONDS:-15}
      WEBTTD_VEHICLE_STATION_DWELL_FERRY_SECONDS: ${WEBTTD_VEHICLE_STATION_DWELL_FERRY_SECONDS:-15}
      WEBTTD_VEHICLE_STATION_DWELL_SHIP_SECONDS: ${WEBTTD_VEHICLE_STATION_DWELL_SHIP_SECONDS:-30}
      WEBTTD_VEHICLE_STATION_DEPARTURE_SPACING_MS: ${WEBTTD_VEHICLE_STATION_DEPARTURE_SPACING_MS:-1000}
      WEBTTD_PUBLIC_URL: https://webttd.zizka.ch/
      WEBTTD_AUTH_COOKIE_SECURE: "true"
      WEBTTD_DISCORD_CLIENT_ID: ${WEBTTD_DISCORD_CLIENT_ID:-}
      WEBTTD_DISCORD_CLIENT_SECRET: ${WEBTTD_DISCORD_CLIENT_SECRET:-}
      WEBTTD_DISCORD_PUBLIC_KEY: ${WEBTTD_DISCORD_PUBLIC_KEY:-}
      WEBTTD_DISCORD_REDIRECT_URI: ${WEBTTD_DISCORD_REDIRECT_URI:-}
      WEBTTD_MOJEID_CLIENT_ID: ${WEBTTD_MOJEID_CLIENT_ID:-}
      WEBTTD_MOJEID_CLIENT_SECRET: ${WEBTTD_MOJEID_CLIENT_SECRET:-}
      WEBTTD_MOJEID_ISSUER: ${WEBTTD_MOJEID_ISSUER:-https://mojeid.cz/oidc/}
      WEBTTD_MOJEID_REDIRECT_URI: ${WEBTTD_MOJEID_REDIRECT_URI:-}
      WEBTTD_MOJEID_TOKEN_AUTH_METHOD: ${WEBTTD_MOJEID_TOKEN_AUTH_METHOD:-basic}
      WEBTTD_LEGACY_COMPANY_TOKEN_ENABLED: "false"
      # Enables AI test logins; these known username=password credentials are reset on every app startup.
      WEBTTD_AUTH_DEV_SEED_ENABLED: "true"
      WEBTTD_GOOGLE_CLIENT_ID: 903638994088-gfcpjp2v7t99l32omk0dcb6kg5q93v58.apps.googleusercontent.com
      WEBTTD_SMTP_HOST: smtp.resend.com
      WEBTTD_SMTP_PORT: "465"
      WEBTTD_SMTP_USERNAME: resend
      WEBTTD_SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      # Keep Stripe credentials as runtime secrets; this compose file is generated and published to Git.
      WEBTTD_STRIPE_SECRET_KEY: ${WEBTTD_STRIPE_SECRET_KEY:-disabled}
      WEBTTD_STRIPE_WEBHOOK_SECRET: ${WEBTTD_STRIPE_WEBHOOK_SECRET:-disabled}
      WEBTTD_STORE_CURRENCY: ${WEBTTD_STORE_CURRENCY:-EUR}
      WEBTTD_STORE_SLATE_LIVERY_PRICE_MINOR: ${WEBTTD_STORE_SLATE_LIVERY_PRICE_MINOR:-450}
      QUARKUS_MAILER_TLS: "true"
      QUARKUS_MAILER_START_TLS: DISABLED
      WEBTTD_MAIL_FROM: noreply@zizka.ch
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  webttd-pg-volume:
    name: webttd-pg-volume
